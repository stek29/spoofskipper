name: Docker images

on:
  push:
    branches:
      - master
    paths:
      - ".env"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-image-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: zapret
            context: ./zapret
            revision_var: REVISION_ZAPRET
            version_var: VERSION_ZAPRET
            base_ver: REVISION_ALPINE_IMAGE
          - image: sing-box
            context: ./sing-box
            revision_var: REVISION_SINGBOX
            version_var: VERSION_SINGBOX
          - image: unbound
            context: ./unbound
            revision_var: REVISION_UNBOUND
            version_var: VERSION_UNBOUND
            base_ver: REVISION_ALPINE_IMAGE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image version
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source .env

          revision="${!REVISION_VAR:?Missing revision}"
          version="${!VERSION_VAR:?Missing version}"

          tag="$revision"
          if [[ -n "${BASE_VER:-}" ]]; then
            base="${!BASE_VER:?Missing base version}"
            tag+="-$base"
          fi
          tag+="-$version"

          {
            echo "revision=$revision"
            echo "base=${base:-}"
            echo "version=$tag"
          } >> "$GITHUB_OUTPUT"
        env:
          REVISION_VAR: ${{ matrix.revision_var }}
          VERSION_VAR: ${{ matrix.version_var }}
          BASE_VER: ${{ matrix.base_ver }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image
        id: registry
        shell: bash
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAMESPACE}/${MATRIX_IMAGE}:${IMAGE_VERSION}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Image already exists: $image"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist yet: $image"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          MATRIX_IMAGE: ${{ matrix.image }}

      - name: Set up QEMU
        if: steps.registry.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.registry.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        if: steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REVISION=${{ steps.image.outputs.revision }}
            BASE_VER=${{ steps.image.outputs.base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
