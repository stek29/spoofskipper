services:
  dnsmap:
    image: ghcr.io/stek29/spoofskipper/dnsmap:$REVISION_DNSMAP-$VERSION_DNSMAP
    command:
      - -config
      - /config/dnsmap.json
    restart: unless-stopped
    network_mode: service:zapret
    # so it will be killed on zapret restart to force nftables reload
    pid: service:zapret
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/config:ro
  
  unbound:
    image: ghcr.io/stek29/spoofskipper/unbound:$REVISION_UNBOUND-$VERSION_UNBOUND
    network_mode: service:zapret
    environment:
      UNBOUND_FORWARD_TCP: 'yes' # TCP isn't forced to National Domain Name System (yet)
      UNBOUND_LISTEN_PORT: '5353'
      UNBOUND_DNS64_PREFIX: '64:ff9b:1:7a61:7072:6574::/96'
    volumes:
      - ./config/unbound-dns64:/etc/unbound

  zapret:
    image: ghcr.io/stek29/spoofskipper/zapret:$REVISION_ZAPRET-$VERSION_ZAPRET
    environment: {}
    #   NFQWS_DEFAULT_ARGS: '--debug' # example
    #   ZAPRET_PRERUN: 'ip r add default via 127.1.2.3'
    command: "/config/zapret.sh"
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/config:ro

  sing-tun:
    image: ghcr.io/stek29/spoofskipper/sing-box:$REVISION_SINGBOX-$VERSION_SINGBOX
    volumes:
      - ./config/sing:/config:ro
      - ./data:/data:rw
    command: ['run', '-c', '/tmp/sing.json']
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
