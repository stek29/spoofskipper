services:
  .zapret2:
    image: ghcr.io/stek29/spoofskipper/zapret2:$REVISION_ZAPRET2-$REVISION_ALPINE_IMAGE-$VERSION_ZAPRET2
    build:
      context: ./zapret2
      args:
        REVISION: $REVISION_ZAPRET2
        BASE_VER: $REVISION_ALPINE_IMAGE
    deploy:
      replicas: 0

  .sing-box:
    image: ghcr.io/stek29/spoofskipper/sing-box:$REVISION_SINGBOX-$VERSION_SINGBOX
    build:
      context: ./sing-box
      args:
        REVISION: $REVISION_SINGBOX
    deploy:
      replicas: 0

  .unbound:
    image: ghcr.io/stek29/spoofskipper/unbound:$REVISION_UNBOUND-$REVISION_ALPINE_IMAGE-$VERSION_UNBOUND
    build:
      context: ./unbound
      args:
        REVISION: $REVISION_UNBOUND
        BASE_VER: $REVISION_ALPINE_IMAGE
    deploy:
      replicas: 0

  .tayga:
    image: ghcr.io/stek29/spoofskipper/tayga:$REVISION_TAYGA-$VERSION_TAYGA
    build:
      context: ./tayga
      args:
        REVISION: $REVISION_TAYGA
    deploy:
      replicas: 0
